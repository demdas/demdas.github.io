<!doctype html>
<html lang="ru" data-theme="light">

<meta charset="utf-8">

<!-- Тема и язык выставляются ДО загрузки стилей: страница не мигает светлым в тёмной теме.
     Ключи localStorage общие со страницей описания (тот же origin): vg-theme = system|light|dark, vg-lang = ru|en|zh.
     data-theme на <html> всегда light или dark: режим «как в системе» разрешается здесь и дальше в core.js (подписка на смену темы системы).
     Параметр ?lang=ru|en|zh имеет приоритет и записывается (ссылку можно переслать). -->
<script>
(function (d) {
  try {
    var s = window.localStorage, q = /[?&]lang=(ru|en|zh)\b/.exec(location.search), th = s.getItem('vg-theme'), lg = s.getItem('vg-lang');
    if (q) { lg = q[1]; s.setItem('vg-lang', lg); }
    if (lg !== 'ru' && lg !== 'en' && lg !== 'zh') {
      var n = (navigator.language || '').toLowerCase();
      lg = n.indexOf('zh') === 0 ? 'zh' : n.indexOf('ru') === 0 ? 'ru' : 'en';
    }
    var dark = th === 'dark' || (th !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    d.setAttribute('data-theme', dark ? 'dark' : 'light'); d.lang = lg === 'zh' ? 'zh-Hans' : lg;
  } catch (e) { d.setAttribute('data-theme', 'light'); }
})(document.documentElement);
</script>
