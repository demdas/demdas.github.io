<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Villa Group · Hillside 19 — прототип системы</title>
<meta name="description" content="Прототип единой системы для девелопера вилл: стройка, продажи, консьерж, магазин. Демо-данные.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif+Display:wght@600&display=swap">
<style>
:root{
  --bg:#F5F2EC; --bg-alt:#EAE4D9; --card:#FFFFFF; --line:#E2DCD1;
  --ink:#18211F; --soft:#4F5A56; --faint:#646D69;
  --sea:#12424A; --sea-hover:#0C3238; --sea-soft:#E3EEEC; --on-sea:#FFFFFF;
  --brass:#826329; --brass-soft:#F3EAD8;
  --ok:#2F6B4A; --ok-soft:#E3F0E7; --warn:#8F5B12; --warn-soft:#F6EBD6;
  --err:#A3352B; --err-soft:#F7E2DF; --info:#2D5A8C; --info-soft:#E2EBF5;
  --lift:0 16px 40px rgba(24,33,31,.14);
  --font-ui:'Inter','Noto Sans SC','Noto Sans Thai',system-ui,-apple-system,sans-serif;
  --font-display:'Noto Serif Display','Noto Serif SC',Georgia,serif;
  --nav-h:64px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121716; --bg-alt:#171D1C; --card:#1A201F; --line:#2A3230;
  --ink:#ECE8E1; --soft:#B3B8B4; --faint:#8C9490;
  --sea:#6FB3B8; --sea-hover:#8CC7CB; --sea-soft:#16302F; --on-sea:#0D1F21;
  --brass:#D2AE6A; --brass-soft:#2B2416;
  --ok:#7CC59C; --ok-soft:#1A2E23; --warn:#E3B15E; --warn-soft:#33280F;
  --err:#EE8A7F; --err-soft:#3A1E1B; --info:#8DB4E0; --info-soft:#172435;
  --lift:0 16px 40px rgba(0,0,0,.5);}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:22px;font-variant-numeric:tabular-nums;min-height:100vh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
body.has-bar{padding-bottom:calc(var(--nav-h) + 84px + env(safe-area-inset-bottom))}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;text-align:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
h1,h2,.disp{font-family:var(--font-display);font-weight:600}
:lang(zh) h1,:lang(zh) h2,:lang(zh) .disp{font-family:'Noto Serif SC',var(--font-display);line-height:1.35}
:lang(zh) body,body:lang(zh){line-height:25px}
h1{font-size:28px;line-height:34px}
h2{font-size:22px;line-height:28px}
h3{font-size:17px;line-height:24px;font-weight:600}
.cap{font-size:11px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.faint{color:var(--faint)} .soft{color:var(--soft)} .sm{font-size:13px;line-height:18px}
.hint{font-size:13px;line-height:18px;color:var(--faint);margin-top:4px}

/* top */
.top{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);height:56px;display:flex;align-items:center;gap:12px;padding:0 16px}
.brandmark{font-family:var(--font-display);font-weight:600;font-size:20px;line-height:1;white-space:nowrap}
.brandmark i{font-style:normal;color:var(--brass)}
.brandsub{font-size:13px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.avatar{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 4px 0 0}
.avatar b{width:36px;height:36px;border-radius:50%;background:var(--sea);color:var(--on-sea);display:grid;place-items:center;font-size:13px;font-weight:600;letter-spacing:.02em}
.avatar span{display:none;font-size:13px;text-align:left;line-height:16px}
.asView{display:none}

/* segments */
.seg{display:inline-flex;background:var(--bg-alt);border-radius:999px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{min-height:44px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--soft);white-space:nowrap;text-align:center}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(24,33,31,.18)}
.seg.sm button{padding:0 11px;min-width:44px}
.caps{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.caps::-webkit-scrollbar{display:none}
.capsule{min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:14px;font-weight:500;white-space:nowrap;color:var(--soft);text-align:center}
.capsule[aria-pressed=true]{background:var(--sea);border-color:var(--sea);color:var(--on-sea)}
.capsule i{font-style:normal;opacity:.7;margin-left:6px}

/* shell */
.side{display:none}
.bnav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--line);display:flex;z-index:40}
.bnav a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;line-height:14px;font-weight:500;color:var(--faint);text-decoration:none;position:relative}
.bnav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.bnav a[aria-current=page]{color:var(--sea)}
.bnav a[aria-current=page]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--sea)}
@media (max-width:359px){.bnav a:not([aria-current=page]) span{display:none}}
.main{padding:20px 16px 24px;max-width:1360px;margin:0 auto}
.head{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.head .tools{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center}
.foot{padding:4px 16px 24px;text-align:center;font-size:12px;color:var(--faint)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
a.card,button.card{display:block;width:100%;text-decoration:none;transition:border-color .15s,background .15s}
a.card:hover,button.card:hover{border-color:var(--sea)}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(2,1fr)}
.kpi{min-height:112px;display:flex!important;flex-direction:column;gap:6px}
.kpi .v{font-size:24px;line-height:30px;font-weight:600}
.kpi .v.brass{color:var(--brass)} .kpi .v.err{color:var(--err)}
.stack>*+*{margin-top:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.mt{margin-top:16px} .mt-s{margin-top:8px}
.bar{height:6px;border-radius:999px;background:var(--bg-alt);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sea);border-radius:999px;transition:width .2s ease-out}
.bar.ok i{background:var(--ok)} .bar.brass i{background:var(--brass)}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:8px;font-size:12px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-warn{background:var(--warn-soft);color:var(--warn)}
.b-err{background:var(--err-soft);color:var(--err)} .b-info{background:var(--info-soft);color:var(--info)}
.b-free{border:1px solid var(--line);color:var(--soft)} .b-sea{background:var(--sea-soft);color:var(--sea)}
.btn{min-height:44px;padding:0 18px;border-radius:10px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;text-align:center;text-decoration:none}
.btn-p{background:var(--sea);color:var(--on-sea)} .btn-p:hover{background:var(--sea-hover)}
.btn-o{border-color:var(--line);background:var(--card);color:var(--ink)} .btn-o:hover{border-color:var(--sea)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.btn.sm{min-height:44px;font-size:13px;padding:0 14px}
.lnk{color:var(--sea);font-weight:600;font-size:14px;display:inline-flex;align-items:center;min-height:44px}
.ibtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;background:var(--card);text-align:center}
.ibtn[disabled]{opacity:.35;cursor:not-allowed}
.empty{padding:36px 16px;text-align:center;color:var(--soft)}
.empty svg{width:32px;height:32px;stroke:var(--faint);fill:none;stroke-width:1.5;margin-bottom:8px}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* dashboard build bars */
.vb{display:flex;align-items:flex-end;gap:2px;height:120px;margin-top:10px}
.vb button{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%;align-items:stretch;padding:0;position:relative}
.vb button span{display:block;border-radius:3px 3px 0 0;min-height:4px;background:var(--line);transition:opacity .15s}
.vb button.sold span{background:var(--sea)} .vb button.reserved span{background:var(--warn)} .vb button.free span{background:var(--line)}
.vb button:hover span{opacity:.7}
.vbn{display:flex;gap:2px;margin-top:4px}
.vbn span{flex:1;text-align:center;font-size:10px;color:var(--faint);min-width:0;overflow:hidden}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.legend .badge::before{content:"";width:8px;height:8px;border-radius:2px;margin-right:6px;background:currentColor}
.fun{display:grid;grid-template-columns:96px 1fr 22px;gap:8px;align-items:center;font-size:13px;margin-top:8px}
.fun i{display:block;height:10px;border-radius:5px;background:var(--sea)}
.seabox{background:var(--sea-soft);border-color:transparent}

/* lots */
.lgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.lot{text-align:left;display:flex;flex-direction:column;gap:6px;padding:12px}
.lot .n{font-size:17px;line-height:24px;font-weight:600}
.sec-t{margin:24px 0 10px}
.dots{display:flex;gap:6px;margin-top:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.d{background:var(--ok)} .dots i.c{background:var(--brass)}
.pay{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.pay:first-child{border-top:0}
.pay .m{flex:1;min-width:0}
.pay .a{font-weight:600;white-space:nowrap}

/* panel */
.panel{position:fixed;z-index:50;background:var(--card);box-shadow:var(--lift);left:0;right:0;bottom:0;height:90vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column}
.panel .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
.panel .ph{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 8px 20px;border-bottom:1px solid var(--line)}
.panel .pb{overflow:auto;padding:16px 20px calc(24px + env(safe-area-inset-bottom));flex:1}
.scrim{position:fixed;inset:0;background:rgba(24,33,31,.45);z-index:45}
.sheet-ov{position:fixed;inset:0;background:rgba(24,33,31,.55);z-index:70;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;box-shadow:var(--lift)}
.sheet h2{margin-bottom:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:14px;z-index:90;max-width:92vw}
.opt{display:flex;gap:12px;align-items:center;width:100%;min-height:56px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;margin-top:8px;text-align:left}
.opt:hover:not([disabled]){border-color:var(--sea)}
.opt[disabled]{opacity:.5;cursor:not-allowed}
.opt .t{flex:1;min-width:0}

/* villa hero & miles */
.hero{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:4/3;background:linear-gradient(160deg,#c9d6d3 0%,#8fb0ad 45%,#3f6f73 100%);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:20px}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,rgba(12,24,24,.74))}
.hero::after{content:"";position:absolute;left:12%;right:12%;bottom:0;height:46%;background:rgba(255,255,255,.2);clip-path:polygon(0 100%,0 55%,22% 40%,50% 18%,78% 40%,100% 55%,100% 100%)}
.hero>*{position:relative;z-index:1}
.hero h1{color:#fff}
.hero .badge{position:absolute;right:16px;top:16px;background:rgba(255,255,255,.92);color:#18211F}
.miles{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px;margin:0 -2px}
.mile{flex:0 0 40%;min-width:132px;scroll-snap-align:start;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--card);text-align:left;display:flex;flex-direction:column;gap:6px;min-height:44px}
.mile[aria-pressed=true]{border:2px solid var(--brass);padding:9px}
.mile .c{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--bg-alt);color:var(--faint)}
.mile.done .c{background:var(--ok);color:#fff} .mile.cur .c{background:var(--brass);color:#fff}
.mile .th{height:48px;border-radius:8px}
.ph-i{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:4/3;display:grid;place-items:center;color:rgba(255,255,255,.85)}
.ph-i svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:1.5}
.pcar{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory}
.pcar>*{flex:0 0 86%;scroll-snap-align:start}
.phb{display:block;width:100%}
.big-b{font-size:28px;line-height:34px;color:var(--brass)}
.docrow{display:flex;gap:12px;align-items:center;width:100%;padding:10px 0;min-height:56px;border-top:1px solid var(--line);text-align:left}
.docrow:first-child{border-top:0}
.docprev{background:var(--bg-alt);border-radius:8px;padding:20px;margin:12px 0}
.docprev i{display:block;height:8px;border-radius:4px;background:var(--line);margin-top:10px}
input[type=range]{width:100%;accent-color:var(--sea);height:44px}

/* chat, concierge */
.split2{display:block}
.crow{text-decoration:none;color:inherit;display:flex;gap:12px;align-items:center;width:100%;padding:12px;border-bottom:1px solid var(--line);text-align:left;min-height:64px}
.crow[aria-current=true]{background:var(--sea-soft)}
.crow .ico{width:38px;height:38px;border-radius:10px;background:var(--bg-alt);display:grid;place-items:center;color:var(--sea);flex:none}
.steps{display:flex;gap:4px;margin:12px 0}
.steps div{flex:1;text-align:center;font-size:12px;padding:8px 2px;border-radius:8px;background:var(--bg-alt);color:var(--faint);font-weight:600}
.steps div.on{background:var(--sea);color:var(--on-sea)} .steps div.past{background:var(--sea-soft);color:var(--sea)}
.chat{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.msg{max-width:88%;padding:10px 12px;border-radius:14px;font-size:15px}
.msg.o{align-self:flex-start;background:var(--bg-alt);border-bottom-left-radius:4px}
.msg.d{align-self:flex-end;background:var(--sea-soft);border-bottom-right-radius:4px}
.msg.s{align-self:center;background:none;color:var(--faint);font-size:12px;padding:0}
.msg .who{font-size:11px;font-weight:600;color:var(--faint);margin-bottom:2px}
.msg q{display:block;quotes:none;margin-top:6px;padding-left:8px;border-left:2px solid var(--line);font-size:12px;color:var(--faint);line-height:16px}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick .btn{height:auto;min-height:44px;padding:8px 14px;font-weight:500;font-size:14px}
.fake-inp{min-height:44px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;color:var(--faint);font-size:14px;margin-top:10px}
.sla{font-weight:600} .sla.warn{color:var(--warn)} .sla.over{color:var(--err)}

/* fitout */
.pos{margin-bottom:12px}
.vars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.var{border:1px solid var(--line);border-radius:12px;padding:6px;text-align:left;position:relative;display:flex;flex-direction:column;gap:4px;min-width:0}
.var[aria-pressed=true]{border:2px solid var(--sea);padding:5px}
.var .im{aspect-ratio:1;max-height:220px;border-radius:8px;display:grid;place-items:center;color:rgba(255,255,255,.85)}
.var .im svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.5}
.var .t{font-size:12px;line-height:15px;font-weight:600;overflow-wrap:anywhere}
.var .p{font-size:12px;color:var(--soft);line-height:15px}
.var .ck{position:absolute;right:8px;top:8px;width:20px;height:20px;border-radius:50%;background:var(--sea);color:var(--on-sea);display:none;place-items:center}
.var[aria-pressed=true] .ck{display:grid}
.var .ck svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:3}
.stock{font-size:11px;font-weight:600}
.estbar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));height:72px;background:var(--card);border-top:1px solid var(--line);z-index:35;display:flex;align-items:center;gap:12px;padding:0 16px;box-shadow:0 -6px 20px rgba(24,33,31,.08)}
.estbox{display:none}

/* kanban */
.kb{display:grid;gap:10px}
.deal{display:flex;flex-direction:column;gap:8px;padding:12px}
.deal .top2{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;text-align:left}
.ini{width:30px;height:30px;border-radius:50%;background:var(--bg-alt);display:inline-grid;place-items:center;font-size:11px;font-weight:600;color:var(--soft)}
.src{display:inline-flex;white-space:nowrap;align-self:flex-start;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--bg-alt);color:var(--soft)}
.kcol{background:var(--bg-alt);border-radius:14px;padding:10px;min-width:0}
.kcol-h{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:2px 4px 8px}
.kcol-h b{font-size:14px} .kcol-h span{font-size:12px;color:var(--soft)}

@media (min-width:600px){
  .main{padding:24px 24px 28px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .lgrid{grid-template-columns:repeat(3,1fr)}
  .sheet-ov{align-items:center} .sheet{border-radius:20px}
  .hero{aspect-ratio:16/9}
  .mile{flex-basis:30%}
}
@media (min-width:1024px){
  body{padding-bottom:0;padding-left:248px}
  body.has-bar{padding-bottom:96px}
  .top{height:64px;padding:0 32px 0 24px;position:sticky;left:0;margin-left:-248px;padding-left:272px}
  .brandmark{position:fixed;left:24px;top:20px;font-size:22px}
  .brandsub{position:fixed;left:24px;top:46px;font-size:13px}
  .asView{display:flex;align-items:center;gap:10px}
  .asView .cap{white-space:nowrap}
  .avatar span{display:block}
  .side{display:block;position:fixed;left:0;top:0;bottom:0;width:248px;background:var(--card);border-right:1px solid var(--line);padding:88px 12px 24px;overflow:auto;z-index:20}
  .side .grp{margin:18px 12px 6px}
  .side a{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:10px;font-size:15px;font-weight:500;color:var(--soft);text-decoration:none;position:relative}
  .side a:hover{background:var(--bg)}
  .side a[aria-current=page]{background:var(--sea-soft);color:var(--sea);font-weight:600}
  .side a[aria-current=page]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--sea)}
  .bnav{display:none}
  .main{padding:32px 32px 40px}
  .head{flex-direction:row;justify-content:space-between;align-items:flex-end}
  h1{font-size:40px;line-height:48px}
  h2{font-size:28px;line-height:36px}
  .kpis{grid-template-columns:repeat(4,1fr);gap:16px}
  .kpi .v{font-size:36px;line-height:40px}
  .tiles{grid-template-columns:repeat(3,1fr)}
  .lgrid{grid-template-columns:repeat(4,1fr)}
  body.panel-open .main{margin-right:480px;max-width:none}
  body.panel-open .lgrid{grid-template-columns:repeat(3,1fr)}

function payStatus(v, k) {
  const p = v.pays[k];
  if (p.paid) return {c:'ok', t:p.paid === TODAY ? t('ps_today') : t('ps_paid', {d:fdate(p.paid)}), s:'paid'};
  if (p.od || (p.due && p.due < TODAY)) return {c:'err', t:t('ps_over', {n:diffDays(TODAY, p.due)}), s:'over'};
  if (p.due && diffDays(p.due, TODAY) <= 60) return {c:'warn', t:t('ps_due', {d:fdate(p.due)}), s:'due'};
  return {c:'free', t:t('ps_plan', {d:p.due ? fmonth(p.due) : '—'}), s:'plan'};
}
const paidOf = v => v.pays.reduce((s, p) => s + (p.paid ? p.amt : 0), 0);
const totOf = v => PRICE[v.type];
function stats() {
  const vs = S.villas, o = {sold:0, res:0, free:0, soldSum:0, resSum:0, paid:0, over:0, overN:0, overD:0, pct:0, stg:{}};
  vs.forEach(v => {
    o[v.sale]++; if (v.sale === 'sold') o.soldSum += PRICE[v.type]; if (v.sale === 'res') o.resSum += PRICE[v.type];
    o.paid += paidOf(v); o.pct += v.pct;
    v.pays.forEach((p, k) => { const s = payStatus(v, k); if (s.s === 'over') { o.over += p.amt; o.overN++; o.overD = Math.max(o.overD, diffDays(TODAY, p.due)); o.overV = v.id; } });
    const st = stageOf(v.pct); o.stg[st] = (o.stg[st] || 0) + 1;
  });
  o.avg = Math.round(o.pct / vs.length);
  return o;
}

   <div class="card" style="margin-top:12px"><span class="cap">Контакты</span><p class="mt-s">${ph}</p><p class="sm faint">Полный номер виден только менеджеру</p></div>
   <div class="card" style="margin-top:12px"><span class="cap">История</span><div class="mt-s sm"><p>${fdate(addDays(TODAY, -d.days - 6))} · заявка получена (${d.src})</p><p>${fdate(addDays(TODAY, -d.days - 2))} · первый звонок, уточнили бюджет</p><p>${fdate(addDays(TODAY, -d.days))} · переведён на этап «${COLN[d.col]}»</p></div></div>
   <p class="mt-s"><span class="cap">Следующий шаг</span><br>Показ онлайн 09.10, 11:00</p>
   ${d.col < 4 ? `<button class="btn btn-p block" style="margin-top:12px" data-act="deal-next" data-v="${d.id}">Дальше →</button>` : ''}</div>`;
}
/* ===== modals ===== */
let MODAL = null, TOAST = null, toastT = null;
const sheet = inner => `<div class="sheet-ov" data-ov="1"><div class="sheet" role="dialog" aria-modal="true">${inner}</div></div>`;
function modalHtml() {
  const m = MODAL; if (!m) return '';
  if (m.type === 'menu') return sheet(`<h2>Роль в демо</h2>${Object.keys(ROLES).map(k => `<button class="opt" data-act="role" data-v="${k}" ${S.role === k ? 'style="border-color:var(--sea)"' : ''}><span class="t"><b>${ROLES[k].full}</b><br><span class="sm soft">${k === 'partner' ? 'Сводка по трём бизнесам' : k === 'sales' ? 'Сделки и лоты' : k === 'buyer' ? 'Кабинет покупателя' : 'Заявки владельцев'}</span></span>${S.role === k ? ic('check') : ''}</button>`).join('')}
    <button class="btn btn-o block" style="margin-top:16px" data-act="reset">Сбросить демо</button><button class="btn btn-p block" style="margin-top:8px" data-act="close-modal">Закрыть</button>`);
  if (m.type === 'pay') {
    const v = V(7), p = v.pays[m.k];
    return sheet(`<h2>${t('pay_sh', {s:t('pn' + m.k)})}</h2><p class="sm soft">${t('pay_amt')}</p><p class="disp" style="font-size:28px;color:var(--brass)">${money(p.amt)}</p>
     <div class="card" style="margin:14px 0;box-shadow:none"><p class="sm">${t('pay_req', {n:m.k + 1})}</p></div>
     <button class="btn btn-p block" data-act="pay-do" data-v="${m.k}">${t('pay_mark')}</button><button class="btn btn-o block" style="margin-top:8px" data-act="close-modal">${t('close')}</button>`);
  }
  if (m.type === 'doc') return sheet(`<h2>${t(m.n)}</h2><div class="docprev"><span class="cap">${t('doc_demo')}</span><p class="disp mt-s" style="font-size:18px">${t(m.n)}</p><i></i><i style="width:90%"></i><i style="width:96%"></i><i style="width:70%"></i><i style="width:84%"></i></div><button class="btn btn-p block" data-act="close-modal">${t('close')}</button>`);
  if (m.type === 'photo') {
    const n = m.stage === 1 ? 1 : 3;
    return sheet(`<h2>${m.stage}. ${stageName(m.stage)}</h2><div class="ph-i" style="${ph(m.stage, m.i)};margin:8px 0">${ic('img')}</div><p class="sm soft" style="text-align:center">${m.i + 1} / ${n}</p>
     <div class="row" style="margin-top:12px"><button class="ibtn" data-act="photo-nav" data-v="-1" aria-label="←" ${n < 2 ? 'disabled' : ''}>←</button><button class="btn btn-p" style="flex:1" data-act="close-modal">${t('close')}</button><button class="ibtn" data-act="photo-nav" data-v="1" aria-label="→" ${n < 2 ? 'disabled' : ''}>→</button></div>`);
  }
  if (m.type === 'assign') return sheet(`<h2>Назначить исполнителя</h2><p class="sm soft">Заявка ${m.id}</p>${PERF.map(p => `<button class="opt" data-act="assign-pick" data-v="${p.id}" ${p.busy ? 'disabled' : ''}><span class="t"><b>${p.n}</b> · <span class="sm soft">${p.role}</span><br><span class="sm soft">${p.lang}</span></span><span class="badge ${p.busy ? 'b-warn' : 'b-ok'}">${p.busy || p.note || 'свободен'}</span></button>`).join('')}<button class="btn btn-o block" style="margin-top:14px" data-act="close-modal">Отмена</button>`);
  if (m.type === 'book') {
    const leads = S.deals.filter(d => d.col === 1 || d.col === 2), v = vById(m.id);
    return sheet(`<h2>Бронь ${v.id}</h2><p class="sm soft">Выберите лид — сделка уйдёт в колонку «Бронь», вилла получит статус «бронь» (${thb(PRICE[v.type])}).</p>${leads.map(d => `<button class="opt" data-act="book-pick" data-v="${d.id}" data-vid="${v.id}"><span class="t"><b>${esc(d.name)}</b> <span class="sm soft">· ${COLN[d.col]}</span><br><span class="sm soft">${d.int} · бюджет ${thb(d.bud)}</span></span>${d.bud >= PRICE[v.type] ? '<span class="badge b-ok">подходит по бюджету</span>' : ''}</button>`).join('')}<button class="btn btn-o block" style="margin-top:14px" data-act="close-modal">Отмена</button>`);
  }
  if (m.type === 'pickvilla') {
    const d = S.deals.find(x => x.id === m.id), ty = /Тип (\w)/.exec(d.int), want = ty ? ty[1] : d.int.startsWith('V-') ? vById(d.int).type : null;
    const fr = S.villas.filter(v => v.sale === 'free').sort((a, b) => (b.type === want) - (a.type === want));
    return sheet(`<h2>Выберите свободную виллу</h2><p class="sm soft">Для ${esc(d.name)} · интерес: ${d.int}</p>${fr.length ? fr.map(v => `<button class="opt" data-act="book-pick" data-v="${d.id}" data-vid="${v.id}"><span class="t"><b>${v.id}</b> · тип ${v.type}<br><span class="sm soft">${thb(PRICE[v.type])} · ${v.pct} %</span></span>${v.type === want ? '<span class="badge b-sea">тип совпадает</span>' : ''}${d.bud >= PRICE[v.type] ? '<span class="badge b-ok">по бюджету</span>' : ''}</button>`).join('') : '<div class="empty"><p>Свободных вилл нет</p></div>'}<button class="btn btn-o block" style="margin-top:14px" data-act="close-modal">Отмена</button>`);
  }
  if (m.type === 'sign') {
    const d = S.deals.find(x => x.id === m.id), v = V(d.villa);
    return sheet(`<h2>Договор подписан?</h2><p>${esc(d.name)} · ${v.id}</p><p class="sm soft mt-s">Вилла станет «продана», в графике платежей «Договор» отметится оплаченным (${thb(v.pays[1].amt)}).</p><button class="btn btn-p block" style="margin-top:14px" data-act="sign-do" data-v="${d.id}">Да, подписан</button><button class="btn btn-o block" style="margin-top:8px" data-act="close-modal">Отмена</button>`);
  }
  if (m.type === 'order') return sheet(`<h2>Заказ ${S.order.id} ${m.upd ? 'обновлён' : 'создан'}</h2><p class="sm soft">Ждёт подтверждения менеджера Чен Ю.</p><div class="mt-s">${FIT.map((p, i) => S.order.sel[i] ? `<div class="row between sm" style="padding:4px 0"><span>${p.v[S.order.sel[i]][0]}</span><b>+${thb(p.v[S.order.sel[i]][1])}</b></div>` : '').join('')}</div>
    <div class="row between" style="border-top:2px solid var(--ink);padding-top:12px;margin-top:8px"><span>Итого доплата</span><b class="disp" style="color:var(--brass)">+${thb(S.order.amt)}</b></div><p class="sm soft mt-s">Оплата — вместе с платежом «Отделка».</p><button class="btn btn-p block" style="margin-top:14px" data-act="close-modal">Готово</button>`);
  return '';
}
function toast(msg) { TOAST = msg; clearTimeout(toastT); toastT = setTimeout(() => { TOAST = null; renderLayer(); }, 4000); renderLayer(); }
function renderLayer() { $('#layer').innerHTML = modalHtml() + (TOAST ? `<div class="toast" role="status">${esc(TOAST)}</div>` : ''); }

/* ===== render ===== */
const fontsLoaded = {};
function loadFont(key, href) { if (fontsLoaded[key]) return; fontsLoaded[key] = 1; const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = href; document.head.appendChild(l); }
function render() {
  let r = parseHash();
  if (!r) { r = {name:ROLES[S.role].start, id:null}; history.replaceState(null, '', '#/' + PATH[r.name]); }
  RT = r; chrome();
  if (S.lang === 'zh' && (RT.name === 'villa' || RT.name === 'dash') || RT.name === 'conc') loadFont('sc', 'https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@600&display=swap');
  if (RT.name === 'conc') loadFont('th', 'https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500&display=swap');
  $('#app').innerHTML = {dash:vDash, lots:vLots, deals:vDeals, villa:vVilla, conc:vConc, fit:vFit}[RT.name]();
  let p = '';
  if (RT.name === 'lots' && RT.id && vById(RT.id)) p = panelVilla(vById(RT.id));
  else if (RT.name === 'deals' && S.dealPanel) p = panelDeal(S.deals.find(d => d.id === S.dealPanel));
  $('#panel').innerHTML = p ? `<div class="scrim" data-act="panel-close"></div><aside class="panel" role="dialog" aria-label="Карточка">${'<div class="grab"></div>'}${p}</aside>` : '';
  document.body.classList.toggle('panel-open', !!p);
  document.body.classList.toggle('has-bar', RT.name === 'fit');
  document.title = 'Villa Group · Hillside 19 — ' + t('nav_' + RT.name);
  renderLayer();
}
let lastName = null;
function rerender() { save(); const y = scrollY; render(); scrollTo(0, y); }

/* ===== actions ===== */
function book(vid, did) {
  const v = vById(vid), d = S.deals.find(x => x.id === did);
  v.sale = 'res'; v.buyer = d.name; v.mgr = d.mgr; v.pays = genPays(v, v.n - 1); v.pays[0].paid = TODAY; v.pays[0].due = null; v.dealId = d.id;
  d.col = 3; d.villa = v.n; d.int = v.id; d.days = 0; S.dealPanel = null;
  MODAL = null; toast(vid + ' забронирована за ' + d.name);
}
const ACT = {
 role(v) { S.role = v; MODAL = null; S.dealPanel = null; const h = '#/' + PATH[ROLES[v].start]; if (location.hash === h) rerender(); else { save(); location.hash = h; } },
 period(v) { S.period = v; rerender(); },
 cur(v) { S.cur = v; rerender(); },
 lang(v) { S.lang = v; if (v === 'zh' && S.cur === 'THB' && RT.name === 'villa') S.cur = 'CNY'; rerender(); },
 'flt-lots'(v) { S.filterLots = v; rerender(); },
 'flt-req'(v) { S.filterReq = v; rerender(); },
 'panel-close'() { S.dealPanel = null; if (RT.name === 'lots') { save(); location.hash = '#/lots'; } else rerender(); },
 'close-modal'() { MODAL = null; renderLayer(); },
 'menu'() { MODAL = {type:'menu'}; renderLayer(); },
 reset() { S = freshState(); MODAL = null; save(); const h = '#/' + PATH[ROLES[S.role].start]; if (location.hash === h) render(); else location.hash = h; toast('Демо сброшено'); },
 remind() { S.remind = true; rerender(); toast('Напоминание отправлено покупателю'); },
 'book-open'(v) { MODAL = {type:'book', id:v}; renderLayer(); },
 'book-pick'(v, el) { book(el.dataset.vid, v); rerender(); },
 mile(v) { S.mile = +v; rerender(); },
 photo(v) { MODAL = {type:'photo', stage:S.mile, i:+v}; renderLayer(); },
 'photo-nav'(v) { const n = MODAL.stage === 1 ? 1 : 3; MODAL.i = (MODAL.i + +v + n) % n; renderLayer(); },
 'pay-open'(v) { MODAL = {type:'pay', k:+v}; renderLayer(); },
 'pay-do'(v) { V(7).pays[+v].paid = TODAY; S.receipt = true; MODAL = null; rerender(); toast(t('pay_toast')); },
 doc(v) { MODAL = {type:'doc', n:v}; renderLayer(); },
 after(v) { S.afterMode = v; rerender(); },
 read(v) { S.readLang = v; rerender(); },
 'assign-open'() { MODAL = {type:'assign', id:curReq().id}; renderLayer(); },
 'assign-pick'(v) { const r = curReq(), p = PERF.find(x => x.id === v); r.perf = v; r.st = 'asg'; r.msgs.push({from:'s', text:'Назначен ' + p.n}); MODAL = null; rerender(); toast('Назначен ' + p.n); },
 'next-status'() { const r = curReq(); r.st = r.st === 'asg' ? 'work' : 'done'; r.msgs.push({from:'s', text:'Статус: ' + RSTAT[r.st][0]}); rerender(); },
 quick(v) { const r = curReq(), q = QUICK[+v], m = {from:'d', o:'ru', x:{ru:q[0], en:q[1], zh:q[2], th:q[3]}, pending:true}; r.msgs.push(m); rerender();
   setTimeout(() => { m.pending = false; save(); if (RT.name === 'conc') rerender(); }, 600); },
 pkg(v) { S.fit = FIT.map(() => +v); rerender(); },
 fitsel(v, el) { S.fit[+el.dataset.p] = +v; rerender(); },
 'order-go'() { const upd = !!S.order; S.order = {id:'М-2041', sel:S.fit.slice(), amt:fitSur()}; MODAL = {type:'order', upd}; rerender(); },
 'order-cancel'() { S.order = null; rerender(); toast('Заказ М-2041 отозван'); },
 dealtab(v) { S.dealTab = +v; rerender(); },
 'deal-open'(v) { S.dealPanel = v; rerender(); },
 'deal-prev'(v) { const d = S.deals.find(x => x.id === v); d.col--; d.days = 0; rerender(); },
 'deal-next'(v) {
   const d = S.deals.find(x => x.id === v);
   if (d.col < 2) { d.col++; d.days = 0; rerender(); }
   else if (d.col === 2) { MODAL = {type:'pickvilla', id:v}; renderLayer(); }
   else if (d.col === 3) { MODAL = {type:'sign', id:v}; renderLayer(); }
 },
 'sign-do'(v) { const d = S.deals.find(x => x.id === v), vl = V(d.villa); vl.sale = 'sold'; vl.pays[1].paid = TODAY; vl.pays[1].due = null; vl.contract = TODAY; d.col = 4; d.days = 0; MODAL = null; rerender(); toast(vl.id + ' продана. Договор оплачен: ' + thb(vl.pays[1].amt)); }
};
function curReq() { return S.reqs.find(r => r.key === RT.id) || S.reqs[0]; }
document.addEventListener('click', e => {
  const go2 = e.target.closest('[data-go-lot]');
  if (go2) { location.hash = '#/lots/' + go2.dataset.goLot; return; }
  if (e.target.dataset && e.target.dataset.ov && MODAL) { MODAL = null; renderLayer(); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  if (el.id === 'avatar') return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el.dataset.v, el);
});
$('#avatar').addEventListener('click', () => ACT.menu());
document.addEventListener('input', e => {
  if (e.target.dataset.act !== 'occ') return;
  S.occ = +e.target.value; const inc = rentInc(S.occ);
  $('#occv').textContent = S.occ; $('#incv').textContent = thb(inc);
  $('#yv').textContent = t('af_y', {p:(inc / PRICE.B * 100).toFixed(1).replace('.', loc() === 'ru' ? ',' : '.')}); save();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && MODAL) { MODAL = null; renderLayer(); } });
window.addEventListener('hashchange', () => {
  const prev = lastName, r = parseHash(); render();
  if (r && prev !== r.name) scrollTo(0, 0);
  lastName = r && r.name;
});
setInterval(() => {
  document.querySelectorAll('[data-sla]').forEach(el => {
    const r = S.reqs.find(x => x.id === el.dataset.sla); if (!r) return;
    const m = slaLeft(r), long = el.dataset.long;
    el.textContent = m > 0 ? (long ? m + ' мин' : m) : (long ? 'SLA нарушен' : 0);
    el.className = 'sla ' + (m === 0 ? 'over' : 'warn');
  });
}, 20000);
render(); lastName = RT.name;
</script>
</body>
</html>
