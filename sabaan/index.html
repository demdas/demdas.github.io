<!doctype html>
<html lang="ru" data-theme="b">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sabaan</title>
<meta name="description" content="Sabaan — среднесрочная аренда жилья на Пхукете через тайских агентов с переводом чата ИИ. Демонстрация для встречи.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --radius-lg:20px; --radius-md:14px; --radius-sm:10px;
    --ok:#2E6B4F; --ok-soft:#E1EFE6;
    --warn:#92651C; --warn-soft:#F7ECD8;
  }
  @media (prefers-color-scheme: dark){
    :root{ --ok:#8AD3A8; --ok-soft:#1E3327; --warn:#E3B564; --warn-soft:#39300F; }
  }

  /* ===== «Тропический модернизм» ===== */
  :root{
    --bg:#F4F7F1; --bg-alt:#E7F0E1; --card:#FFFFFF; --card-alt:#FAFCF8;
    --ink:#10241C; --soft:#4C5F55; --faint:#86988C;
    --border:#D6E4D0; --border-soft:#EAF3E6;
    --accent:#E8A23D; --accent-hover:#C6851F; --accent-soft:#FBEBCF; --accent-contrast:#10241C;
    --teal:#0E4B3C; --teal-soft:#D9EBE3; --teal-contrast:#FFFFFF;
    --shadow:0 12px 32px rgba(16,36,28,.16);
    --font-display:'Space Grotesk',-apple-system,sans-serif; --font-display-th:'Noto Sans Thai',sans-serif;
    --font-body:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif; --font-body-th:'Noto Sans Thai',sans-serif;
    --scrim-strong:rgba(8,20,14,.85); --scrim-mid:rgba(8,20,14,.3); --hero-ink:#F4F7F1; --hero-slogan:#FBEBCF;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0D1712; --bg-alt:#132019; --card:#132019; --card-alt:#182821;
      --ink:#EAF3E9; --soft:#B9CBC0; --faint:#7E9488;
      --border:#20362B; --border-soft:#192B22;
      --accent:#F4BD68; --accent-hover:#F8CE8B; --accent-soft:#2B2413; --accent-contrast:#10241C;
      --teal:#3E9C7E; --teal-soft:#152A22; --teal-contrast:#08150F;
      --shadow:0 12px 32px rgba(0,0,0,.55);
    }
  }
  h1, h2, h3{letter-spacing:-.02em}
  /* Тайский: тональные знаки и диакритики стоят стеком над буквой — отрицательный трекинг их сталкивает. */
  html[lang="th"] h1, html[lang="th"] h2, html[lang="th"] h3{letter-spacing:normal}
  .display{font-weight:700}
  html[lang="th"] .display{font-weight:800}

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--font-body);
    line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  html[lang="th"] body, [lang="th"]{font-family:var(--font-body-th), var(--font-body)}
  html[lang="th"] .display, [lang="th"].display{font-family:var(--font-display-th), var(--font-display)}
  .display{font-family:var(--font-display)}
  a{color:var(--accent)}
  .wrap{max-width:1040px;margin:0 auto;padding-inline:16px}
  section{padding-block:44px}
  @media (min-width:768px){ section{padding-block:72px} }
  h1,h2,h3{margin:0; color:var(--ink)}
  h2{font-family:var(--font-display); font-weight:700; font-size:26px; letter-spacing:-.01em}
  @media (min-width:768px){ h2{font-size:34px} }
  p{margin:0}
  .eyebrow{
    display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700;
    letter-spacing:.06em; text-transform:uppercase; color:var(--accent);
    background:var(--accent-soft); padding:6px 12px; border-radius:20px;
  }
  .lead{color:var(--soft); font-size:16px; max-width:62ch}
  @media (min-width:768px){ .lead{font-size:18px} }

  /* focus */
  a:focus-visible, button:focus-visible, input:focus-visible, [tabindex]:focus-visible{
    outline:2.5px solid var(--accent); outline-offset:2px; border-radius:6px;
  }

  /* top bar */
  .topbar{
    position:sticky; top:0; z-index:40; backdrop-filter:blur(10px);
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    border-bottom:1px solid var(--border-soft);
  }
  .topbar-inner{display:flex; align-items:center; justify-content:space-between; gap:10px; padding-block:10px; flex-wrap:wrap}
  .brand{display:flex; align-items:baseline; gap:8px; font-family:var(--font-display); font-weight:700; font-size:19px}
  .brand small{font-family:var(--font-body); font-weight:600; font-size:11px; color:var(--faint); letter-spacing:.03em}
  @media (max-width:479px){ .brand small{display:none} }
  .switchers{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .langsw{display:flex; gap:4px; background:var(--card-alt); border:1px solid var(--border); border-radius:999px; padding:3px}
  .langsw button{
    font:inherit; font-size:13px; font-weight:700; color:var(--soft); background:none; border:0;
    padding:7px 13px; border-radius:999px; cursor:pointer; min-height:32px;
  }
  .langsw button[aria-pressed="true"]{background:var(--accent); color:var(--accent-contrast)}

  .draft-strip{
    display:none; font-size:12px; color:var(--warn); background:var(--warn-soft);
    border-top:1px solid var(--border-soft); text-align:center; padding:6px 10px;
  }
  html[lang="th"] .draft-strip{display:block}

  /* hero — фото на всю ширину со скримом */
  .hero{position:relative; overflow:hidden; display:flex; align-items:flex-end;
    min-height:100vh; min-height:calc(100svh - 62px)}
  @media (min-width:768px){ .hero{min-height:640px} }
  .hero-media{position:absolute; inset:0; z-index:0}
  .hero-media img{width:100%; height:100%; object-fit:cover; display:block}
  .hero-media .scrim{position:absolute; inset:0;
    background:linear-gradient(to top, var(--scrim-strong) 0%, var(--scrim-mid) 46%, transparent 78%)}
  .hero .wrap{position:relative; z-index:1; padding-block:36px 40px; width:100%}
  .badges{display:flex; flex-wrap:wrap; gap:8px; margin-top:20px}
  .badge{
    font-size:12.5px; font-weight:600; color:var(--hero-ink); background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.35); backdrop-filter:blur(4px); padding:6px 12px; border-radius:999px;
  }
  .hero .eyebrow{background:rgba(255,255,255,.18); backdrop-filter:blur(6px); color:var(--hero-ink)}
  .hero h1{font-size:44px; line-height:1.02; margin-top:14px; color:var(--hero-ink)}
  @media (min-width:768px){ .hero h1{font-size:72px} }
  .slogan{font-size:18px; color:var(--hero-slogan); font-weight:600; margin-top:10px; max-width:42ch}
  @media (min-width:768px){ .slogan{font-size:22px} }
  .hero-lead{margin-top:16px; color:var(--hero-ink); opacity:.94; max-width:62ch}
  .cta-row{display:flex; flex-wrap:wrap; gap:10px; margin-top:26px}
  .btn{
    font:inherit; font-size:15px; font-weight:700; border-radius:999px; padding:13px 22px;
    border:1px solid transparent; cursor:pointer; display:inline-flex; align-items:center; gap:8px;
    min-height:44px; text-decoration:none; line-height:1.1;
  }
  .btn-primary{background:var(--accent); color:var(--accent-contrast)}
  .btn-primary:hover{background:var(--accent-hover)}
  .btn-ghost{background:var(--card); color:var(--ink); border-color:var(--border)}
  .btn-ghost:hover{border-color:var(--accent); color:var(--accent)}
  .hero .btn-ghost{background:rgba(255,255,255,.12); color:var(--hero-ink); border-color:rgba(255,255,255,.4); backdrop-filter:blur(6px)}
  .hero .btn-ghost:hover{border-color:rgba(255,255,255,.7); color:var(--hero-ink)}
  .btn-teal{background:var(--teal); color:var(--teal-contrast)}
  .topbar-cta{font-size:13px; padding:7px 13px 7px 11px; min-height:32px; gap:5px; white-space:nowrap}

  /* cards / sections alt bg */
  .alt{background:var(--bg-alt)}
  .card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow)}

  /* why & for whom */
  .why-block{margin-top:30px}
  .why-block:first-of-type{margin-top:26px}
  .why-block h3{font-family:var(--font-display); font-size:19px; font-weight:700; margin-bottom:14px}
  .why-goals{list-style:none; margin:0; padding:0; display:grid; gap:10px}
  .why-goals li{
    display:flex; gap:10px; align-items:flex-start; font-size:14.5px; color:var(--soft);
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius-md); padding:12px 14px;
  }
  .why-goals li::before{content:"—"; color:var(--accent); flex:none; font-weight:700}
  .pains-grid{display:grid; grid-template-columns:1fr; gap:18px; margin-top:6px}
  @media (min-width:768px){ .pains-grid{grid-template-columns:repeat(3,1fr)} }
  .pain-col{display:flex; flex-direction:column; gap:10px}
  .pain-label{
    display:inline-flex; align-self:flex-start; font-size:11px; font-weight:800; letter-spacing:.05em;
    text-transform:uppercase; padding:5px 11px; border-radius:999px;
  }
  .pain-label.role-client{background:var(--accent-soft); color:var(--accent-hover)}
  .pain-label.role-agent{background:var(--teal-soft); color:var(--teal)}
  .pain-label.role-owner{background:var(--card-alt); color:var(--soft); border:1px solid var(--border)}
  .pain-list{list-style:none; margin:0; padding:0; display:grid; gap:8px}
  .pain-list li{font-size:13.5px; color:var(--soft); padding:10px 12px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius-sm)}

  /* how it works */
  .steps{display:grid; grid-template-columns:1fr; gap:14px; margin-top:28px}
  @media (min-width:640px){ .steps{grid-template-columns:1fr 1fr} }
  @media (min-width:1000px){ .steps{grid-template-columns:repeat(5,1fr)} }
  .step{padding:20px; display:flex; flex-direction:column; gap:8px}
  .step-num{
    width:32px; height:32px; border-radius:10px; background:var(--accent-soft); color:var(--accent);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-family:var(--font-display);
  }
  .step h3{font-size:16px; font-weight:700}
  .step p{color:var(--soft); font-size:14px}

  /* chat demo */
  .chat-shell{margin-top:26px; display:flex; flex-direction:column; align-items:center; gap:14px}
  .seg{display:inline-flex; gap:4px; background:var(--card-alt); border:1px solid var(--border); border-radius:999px; padding:3px; flex-wrap:wrap}
  .seg button{
    font:inherit; font-size:13.5px; font-weight:700; color:var(--soft); background:none; border:0;
    padding:9px 14px; border-radius:999px; cursor:pointer; min-height:40px;
  }
  .seg button[aria-pressed="true"]{background:var(--teal); color:var(--teal-contrast)}
  .demo-note{font-size:12.5px; color:var(--faint); text-align:center}
  .phone{
    width:100%; max-width:480px;
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg);
    box-shadow:var(--shadow); overflow:hidden; display:flex; flex-direction:column; min-height:420px;
  }
  .phone-head{background:var(--teal); color:var(--teal-contrast); padding:14px 16px}
  .phone-head b{display:block; font-size:15px}
  .phone-head span{font-size:12px; opacity:.85}
  .phone-body{flex:1; padding:14px; display:flex; flex-direction:column; gap:12px; overflow-y:auto; max-height:460px}
  .bubble-row{display:flex}
  .bubble-row.me{justify-content:flex-end}
  .bubble{max-width:86%; display:flex; flex-direction:column; gap:6px}
  .bubble-main{
    padding:10px 13px; border-radius:16px; font-size:14.5px; background:var(--bg-alt); color:var(--ink);
    border:1px solid var(--border-soft);
  }
  .bubble-row.me .bubble-main{background:var(--accent); color:var(--accent-contrast); border-color:transparent}
  .bubble-orig{
    font:inherit; font-size:12.5px; color:var(--soft); background:none; border:1px dashed var(--border);
    border-radius:12px; padding:7px 10px; text-align:left; cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .bubble-orig:hover{border-color:var(--accent); color:var(--accent)}
  .bubble-orig .q{opacity:.6}
  .chat-input-row{display:flex; gap:8px; padding:12px; border-top:1px solid var(--border-soft); background:var(--card-alt)}
  .chat-input-row input{
    flex:1; font:inherit; font-size:15px; padding:11px 13px; border-radius:12px; border:1px solid var(--border);
    background:var(--card); color:var(--ink); min-height:44px;
  }
  .chat-input-row button{min-height:44px}
  .toast{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:80;
    background:var(--ink); color:var(--bg); font-size:14px; font-weight:600; padding:10px 18px;
    border-radius:24px; opacity:0; pointer-events:none; transition:opacity .18s;
  }
  .toast.on{opacity:1}

  /* request card */
  .req-toggle-row{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-top:22px}
  .req-card{margin-top:14px; padding:22px; display:grid; gap:12px}
  .req-field{display:flex; justify-content:space-between; gap:16px; padding-block:9px; border-bottom:1px solid var(--border-soft)}
  .req-field:last-child{border-bottom:0}
  .req-field b{font-weight:600; color:var(--soft); font-size:13.5px}
  .req-field span{font-weight:700; text-align:right}

  /* bullet lists */
  .bullets{list-style:none; margin:22px 0 0; padding:0; display:grid; gap:12px}
  .bullets li{
    display:flex; gap:12px; align-items:flex-start; background:var(--card); border:1px solid var(--border);
    border-radius:var(--radius-md); padding:14px 16px;
  }
  .bullets li .ico{
    flex:none; width:26px; height:26px; border-radius:8px; background:var(--teal-soft); color:var(--teal);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px;
  }
  .bullets.trust li .ico{background:var(--accent-soft); color:var(--accent)}
  .note-box{
    margin-top:16px; padding:14px 16px; border-radius:var(--radius-md); background:var(--warn-soft);
    color:var(--soft); font-size:13.5px; border:1px solid var(--border-soft);
  }

  /* prototype links */
  .proto-cards{display:grid; grid-template-columns:1fr; gap:14px; margin-top:28px}
  @media (min-width:640px){ .proto-cards{grid-template-columns:repeat(2,1fr)} }
  @media (min-width:1000px){ .proto-cards{grid-template-columns:repeat(3,1fr)} }
  .proto-card{
    display:flex; flex-direction:column; gap:8px; padding:22px; min-height:44px;
    text-decoration:none; color:inherit; transition:border-color .15s, transform .15s;
  }
  .proto-card:hover{border-color:var(--teal); transform:translateY(-2px)}
  .proto-card h3{font-family:var(--font-display); font-size:18px; font-weight:700; color:var(--teal)}
  .proto-card p{color:var(--soft); font-size:14px}

  /* catalog */
  .catalog-example-line{margin-top:16px; font-size:13px; color:var(--soft)}
  .catalog-cards{display:grid; grid-template-columns:1fr; gap:16px; margin-top:20px}
  @media (min-width:640px){ .catalog-cards{grid-template-columns:repeat(2,1fr)} }
  @media (min-width:1000px){ .catalog-cards{grid-template-columns:repeat(4,1fr)} }
  .catalog-card{padding:0; overflow:hidden; display:flex; flex-direction:column; text-decoration:none; color:inherit}
  .catalog-photo-wrap{position:relative; aspect-ratio:4/3; background:var(--bg-alt)}
  .catalog-photo-wrap img{width:100%; height:100%; object-fit:cover; display:block}
  .catalog-district-badge{
    position:absolute; top:10px; left:10px; font-size:11px; font-weight:700; color:var(--ink);
    background:rgba(255,255,255,.88); backdrop-filter:blur(4px); padding:4px 10px; border-radius:999px;
  }
  .catalog-example-badge{
    position:absolute; top:10px; right:10px; font-size:10px; font-weight:700; color:var(--accent-contrast);
    background:var(--accent); padding:4px 9px; border-radius:999px; letter-spacing:.02em;
  }
  .catalog-card-body{padding:16px 18px 18px; display:flex; flex-direction:column; gap:10px; flex:1}
  .catalog-card h3{font-family:var(--font-display); font-size:16px; font-weight:700}
  .catalog-sub{color:var(--soft); font-size:13px}
  .catalog-price{display:flex; flex-direction:column; gap:2px; font-size:13px; color:var(--soft)}
  .catalog-price b{color:var(--ink); font-variant-numeric:tabular-nums}
  .catalog-total{font-family:var(--font-display); font-size:19px; font-weight:700; margin-top:2px}
  .catalog-total small{font-family:var(--font-body); font-size:12px; font-weight:600; color:var(--soft)}
  .catalog-cal-bar{display:flex; width:100%; height:10px; border-radius:6px; overflow:hidden; border:1px solid var(--border)}
  .catalog-cal-seg{height:100%}
  .catalog-cal-caption{font-size:11px; color:var(--faint); margin-top:5px}
  .catalog-card-body .btn{margin-top:auto; align-self:flex-start}
  .catalog-legend{display:flex; flex-wrap:wrap; gap:10px 16px; margin-top:18px; font-size:12px; color:var(--soft)}
  .catalog-legend span{display:inline-flex; align-items:center; gap:6px}
  .catalog-legend i{width:9px; height:9px; border-radius:3px; display:inline-block; flex:none}
  .cal-c-free{background:var(--ok)}
  .cal-c-negotiating{background:var(--warn)}
  .cal-c-confirmed{background:var(--teal)}
  .cal-c-blocked{background:var(--accent)}

  /* seasons */
  .season-card{margin-top:18px; padding:22px}
  .season-example{font-size:13px; color:var(--faint); margin-bottom:10px}
  .season-price{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
  .season-price b{font-family:var(--font-display); font-size:38px; font-weight:700}
  .season-dates{color:var(--soft); font-size:13.5px; margin-top:4px}
  .season-derived{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px}
  .derived-item{background:var(--bg-alt); border-radius:var(--radius-sm); padding:10px 12px}
  .derived-item span{display:block; font-size:12px; color:var(--faint)}
  .derived-item b{font-size:16px; font-variant-numeric:tabular-nums}
  .season-loyalty{margin-top:14px; padding:12px 14px; border-radius:var(--radius-sm); background:var(--teal-soft); color:var(--teal); font-size:13.5px; font-weight:600}

  /* market stats */
  .stats{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:26px}
  @media (min-width:768px){ .stats{grid-template-columns:repeat(4,1fr)} }
  .stat{padding:18px; display:flex; flex-direction:column; gap:6px}
  .stat b{font-family:var(--font-display); font-size:26px; font-weight:700}
  .stat p{font-size:13.5px; color:var(--soft)}
  .stat small{font-size:11.5px; color:var(--faint)}

  /* caveats */
  .caveats{list-style:none; margin:22px 0 0; padding:0; display:grid; gap:10px}
  .caveats li{
    padding:12px 16px; border-radius:var(--radius-sm); background:var(--card); border:1px dashed var(--border);
    color:var(--soft); font-size:14px;
  }

  /* final cta */
  .final-cta{padding:32px 22px; text-align:center}
  .final-cta .cta-row{justify-content:center}

  footer{padding:26px 0 40px; text-align:center; color:var(--faint); font-size:13px}
  footer .sources{max-width:70ch; margin:12px auto 0; font-size:11.5px; line-height:1.6}
  footer a{color:var(--faint); text-decoration:underline}

  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
    clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none!important; animation:none!important}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap topbar-inner">
    <div class="brand">Sabaan <small id="brand-tag">demda.pro</small></div>
    <div class="switchers">
      <div class="langsw" role="group" aria-label="Язык страницы" id="langsw">
        <button type="button" data-lang="ru" aria-pressed="true">RU</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
        <button type="button" data-lang="th" aria-pressed="false">TH</button>
      </div>
      <a href="/sabaan/app/#/" class="btn btn-teal topbar-cta" id="topbar-proto-link">
        <span aria-hidden="true">&rarr;</span><span id="topbar-proto-text"></span>
      </a>
    </div>
  </div>
  <div class="draft-strip">ข้อความฉบับร่าง — กำลังตรวจสอบ</div>
</div>

<main>
  <section class="hero">
    <div class="hero-media">
      <img id="hero-img" src="img/b/hero.jpg" width="1440" height="810" alt="" fetchpriority="high">
      <div class="scrim"></div>
    </div>
    <div class="wrap">

  /* ---------- утилиты ---------- */
  function el(id){ return document.getElementById(id); }
  function esc(s){ return String(s).replace(/[<>&"]/g, function(c){ return {"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]; }); }
  function set(id, text){ var e = el(id); if (e) e.textContent = text; }
  function money(n, lang){
    var num = n.toLocaleString("en-US");
    return lang === "th" ? num + " บาท" : num + " THB";
  }

  function showToast(msg){
    var t = el("toast");
    t.textContent = msg;
    t.classList.add("on");
    clearTimeout(t._h);
    t._h = setTimeout(function(){ t.classList.remove("on"); }, 2000);
  }

  function copyText(text){
    var done = function(){ showToast(DICT[state.lang].chat.copied); };
    try {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text, done); });
        return;
      }
    } catch (e) { /* переходим к запасному способу */ }
    fallbackCopy(text, done);
  }

  function fallbackCopy(text, done){
    try {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      document.execCommand("copy");
      document.body.removeChild(ta);
      done();
    } catch (e) {
      showToast(text);
    }
  }

     Демо не зависит от языка страницы: для каждого сообщения большой текст —
     перевод на язык ДРУГОЙ стороны (что реально получает собеседник), а
     цитата снизу — оригинал на языке автора. Правило фиксировано по m.from,
     RU/EN/TH переключатель языка страницы меняет только интерфейсные подписи. */
  function nativeLangOf(role){ return role === "agent" ? "th" : "ru"; }
  function otherLangOf(role){ return role === "agent" ? "ru" : "th"; }

  function renderChat(){
    var d = DICT[state.lang].chat;

    set("chat-phone-title", d.phoneTitle);
    set("chat-phone-sub", d.phoneSub);
    el("chat-input").placeholder = d.placeholder;

    var html = CHAT_MESSAGES.map(function(m){ return chatBubbleHtml(m, d); }).join("");
    el("chat-body").innerHTML = html;
    bindOriginalButtons();
    var body = el("chat-body");
    body.scrollTop = body.scrollHeight;
  }

  function chatBubbleHtml(m, d){
    var translatedLang = otherLangOf(m.from);
    var originalLang = nativeLangOf(m.from);
    var big = m[translatedLang];
    var original = m[originalLang];
    var alignRight = m.from === "manager";

    var rowClass = alignRight ? "bubble-row me" : "bubble-row";
    var mainHtml = '<div class="bubble-main" lang="' + translatedLang + '">' + esc(big) + "</div>";
    var quoteHtml = '<button type="button" class="bubble-orig" data-copy="' + esc(original).replace(/"/g, "&quot;") +
      '" lang="' + originalLang + '" aria-label="' + esc(d.original) + ": " + esc(original) + '">' +
      '<span class="q">“</span>' + esc(original) + '<span class="q">”</span></button>';
    return '<div class="' + rowClass + '"><div class="bubble">' + mainHtml + quoteHtml + "</div></div>";
  }

  function bindOriginalButtons(){
    document.querySelectorAll(".bubble-orig").forEach(function(b){
      b.onclick = function(){ copyText(b.dataset.copy); };
    });
  }

  function sendChatMessage(text){
    var isThai = /[฀-๿]/.test(text);
    var role = isThai ? "agent" : "manager";
    var pair = DEMO_TRANSLATIONS[state.demoIdx % DEMO_TRANSLATIONS.length];
    state.demoIdx++;
    var msg = {from: role, en: pair.en};
    if (isThai) { msg.th = text; msg.ru = pair.ru; }
    else { msg.ru = text; msg.th = pair.th; }
    CHAT_MESSAGES.push(msg);
    renderChat();
  }

  /* ---------- карточка запроса ---------- */
  function renderCard(){
    var d = DICT[state.lang].req;
    var data = CARD_DATA[state.cardLang];
    var langAttr = state.cardLang;
    var rows = [
      ["district", d.fields.district],
      ["term", d.fields.term],
      ["checkin", d.fields.checkin],
      ["bedrooms", d.fields.bedrooms],
      ["budget", d.fields.budget],
      ["clientLang", d.fields.clientLang]
    ];
    el("req-fields").innerHTML = rows.map(function(r){
      return '<div class="req-field"><b>' + esc(r[1]) + '</b><span lang="' + langAttr + '">' + esc(data[r[0]]) + "</span></div>";
    }).join("");
    document.querySelectorAll("#req-lang-group button").forEach(function(b){
      b.setAttribute("aria-pressed", b.dataset.cardlang === state.cardLang ? "true" : "false");
    });
  }

  /* ---------- каталог ---------- */
  function renderCatalog(){
    var d = DICT[state.lang].catalog;
    var moneyLang = state.lang === "th" ? "th" : "en";
    var CAL_TOTAL_DAYS = 60;
    var photos = PHOTOS;

    el("catalog-cards").innerHTML = CATALOG_PROPERTIES.map(function(p){
      var subParts = [d.districts[p.district], d.types[p.type]];
      if (p.bedrooms > 0) subParts.push(d.bedrooms[p.bedrooms]);
      var sub = subParts.join(" · ");
      var total = p.ownerPrice + p.commission;
      var barHtml = p.calendar.map(function(seg){
        var pct = (seg.days / CAL_TOTAL_DAYS * 100).toFixed(2);
        return '<div class="catalog-cal-seg cal-c-' + seg.status + '" style="width:' + pct + '%"></div>';
      }).join("");
      var href = "/sabaan/app/#/client/property/" + p.id;
      var photo = photos[p.id];
      var title = p.title[state.lang];
      var photoAlt = title + ". " + d.photoAltSuffix;
      return '<a class="catalog-card card" href="' + esc(href) + '">' +
        '<div class="catalog-photo-wrap">' +
          '<img src="' + esc(photo.src) + '" width="' + photo.w + '" height="' + photo.h + '" alt="' + esc(photoAlt) + '" loading="lazy">' +
          '<span class="catalog-district-badge">' + esc(d.districts[p.district]) + '</span>' +
          '<span class="catalog-example-badge">' + esc(d.exampleBadge) + '</span>' +
        '</div>' +
        '<div class="catalog-card-body">' +
        '<h3>' + esc(title) + '</h3>' +
        '<p class="catalog-sub">' + esc(sub) + '</p>' +
        '<div class="catalog-price">' +
          '<span>' + esc(d.ownerPriceLabel) + ': <b>' + money(p.ownerPrice, moneyLang) + '</b></span>' +
          '<span>' + esc(d.commissionLabel) + ': <b>' + money(p.commission, moneyLang) + '</b></span>' +
        '</div>' +
        '<div class="catalog-total">' + money(total, moneyLang) + ' <small>' + esc(d.perMonth) + '</small></div>' +
        '<div class="catalog-cal">' +
          '<div class="catalog-cal-bar">' + barHtml + '</div>' +
          '<p class="catalog-cal-caption">' + esc(d.calendarCaption) + '</p>' +
        '</div>' +
        '<span class="btn btn-primary">' + esc(d.bookBtn) + '</span>' +
        '</div>' +
        '</a>';
    }).join("");

    el("catalog-legend").innerHTML = ["free", "negotiating", "confirmed", "blocked"].map(function(s){
      return '<span><i class="cal-c-' + s + '"></i>' + esc(d.legend[s]) + '</span>';
    }).join("");
  }

  /* ---------- сезоны ---------- */
  function renderSeasons(){
    var d = DICT[state.lang].season;
    var price = SEASON_PRICE[state.season];
    var lang = state.lang === "th" ? "th" : "ru";

    document.querySelectorAll("#season-group button").forEach(function(b){
      b.setAttribute("aria-pressed", b.dataset.season === state.season ? "true" : "false");
    });

    set("season-price", money(price, lang === "th" ? "th" : "en"));
    set("season-two-months-value", money(price * 2, lang === "th" ? "th" : "en"));
    set("season-commission-value", money(Math.round(price * COMMISSION_RATE), lang === "th" ? "th" : "en"));

    var dates, note;
    if (state.season === "high") { dates = d.highDates; note = d.highNote; }
    else if (state.season === "shoulder") { dates = d.shoulderDates; note = d.shoulderNote; }
    else { dates = d.lowDates; note = d.lowNote; }
    set("season-dates", dates);
    set("season-note", note);
  }

  /* ---------- обработчики ---------- */
  document.querySelectorAll("#langsw button").forEach(function(b){
    b.addEventListener("click", function(){
      state.lang = b.dataset.lang;
      try { window.localStorage.setItem("sabaan-lang", state.lang); } catch (e) { /* игнорируем */ }
      renderStatic(state.lang);
    });
  });

  document.querySelectorAll("#req-lang-group button").forEach(function(b){
    b.addEventListener("click", function(){
      state.cardLang = b.dataset.cardlang;
      renderCard();
    });
  });

  document.querySelectorAll("#season-group button").forEach(function(b){
    b.addEventListener("click", function(){
      state.season = b.dataset.season;
      renderSeasons();
    });
  });

  el("chat-form").addEventListener("submit", function(ev){
    ev.preventDefault();
    var input = el("chat-input");
    var text = input.value.trim();
    if (!text) return;
    sendChatMessage(text);
    input.value = "";
    input.focus();
  });

  /* ---------- первый рендер ---------- */
  renderStatic(state.lang);
})();
</script>
</body>
</html>
